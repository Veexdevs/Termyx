name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Run desktop tests
        run: gradle :desktop:test --no-daemon

      - name: Package Windows distribution (.exe)
        run: gradle :desktop:createDistributable --no-daemon

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: termyx-windows-exe
          path: desktop/build/compose/binaries/main/app/**/TERMYX.exe
          if-no-files-found: warn
