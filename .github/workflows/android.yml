name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install NDK & build-tools
        run: sdkmanager "ndk;26.3.11579264" "build-tools;34.0.0" "platforms;android-34"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Run unit tests
        run: gradle :android:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle :android:assembleDebug --no-daemon

      - name: Build release APKs (ABI splits)
        run: gradle :android:assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: termyx-android-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: termyx-android-release
          path: android/build/outputs/apk/release/*.apk
          if-no-files-found: warn
