name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
          export PATH=$PATH:$JAVA_HOME/bin
          python3 - <<'PY'
          import urllib.request, zipfile, os, shutil
          url = "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          zip_path = "/tmp/cmdtools.zip"
          print("downloading Android command-line tools...")
          urllib.request.urlretrieve(url, zip_path)
          dest = os.path.expanduser("~/android-sdk/cmdline-tools")
          os.makedirs(dest, exist_ok=True)
          with zipfile.ZipFile(zip_path) as z:
              z.extractall(dest)
          inner = os.path.join(dest, "cmdline-tools")
          target = os.path.join(dest, "latest")
          if os.path.isdir(inner):
              if os.path.exists(target):
                  shutil.rmtree(target)
              os.rename(inner, target)
          print("extracted SDK command-line tools to", target)
          PY
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle :android:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: termyx-android-release
          path: android/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle :desktop:createDistributable --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: termyx-windows-exe
          path: desktop/build/compose/binaries/main/app/**/TERMYX.exe
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage assets
        run: |
          mkdir -p dist
          find artifacts -name '*.apk' -exec cp {} dist/ \;
          find artifacts -name 'TERMYX.exe' -exec cp {} dist/ \;
          ls -la dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
